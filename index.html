<style>
:root{color-scheme:dark;--bg:#0f0f0f;--panel:#1c1c1c;--line:#333330;--ink:#f2f0ea;--ink-secondary:#b6b3ac;--ink-muted:#85827b;--accent:#9a1f1f;--accent-soft:rgba(154,31,31,.16);--font:"Montserrat",-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;font-size:14px;background:radial-gradient(ellipse 900px 500px at 88% -10%,rgba(154,31,31,.10),transparent 60%),var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid #ff8f8f;outline-offset:2px}
.gate-card{width:100%;max-width:360px}
.brandmark{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px}
.brandmark .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.brandmark span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);font-weight:600}
h1{font-family:var(--font);font-weight:700;font-size:28px;line-height:1.15;margin:0 0 22px;letter-spacing:-.01em;text-wrap:balance;background:linear-gradient(100deg,var(--ink) 55%,#ff8f8f 130%);-webkit-background-clip:text;background-clip:text;color:transparent}
input[type=password]{width:100%;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 20px var(--font);letter-spacing:.3em;padding:0 16px;outline:none}
input[type=password]:focus{border-color:var(--accent)}
button{width:100%;height:52px;margin-top:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 16px var(--font);cursor:pointer}
.gate-row{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--ink-secondary);font-size:14px}
.gate-row input{width:18px;height:18px;accent-color:var(--accent)}
#err{min-height:20px;margin-top:12px;color:#e26a6a;font-size:14px}
</style>
</head>
<body>
<form class="gate-card" id="f" autocomplete="off">
  <div class="brandmark"><span class="dot"></span><span>Твиглс · отдел продаж</span></div>
  <h1>Расчёт зарплаты</h1>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Пароль" aria-label="Пароль" autofocus>
  <button type="submit">Открыть</button>
  <label class="gate-row"><input type="checkbox" id="rem" checked> Запомнить на этом устройстве</label>
  <div id="err" role="alert"></div>
</form>
<script>
(function(){
  var KEY='zpGate', errEl=document.getElementById('err'), enc=null;
  function b64(x){var b=atob(x),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
  function load(){return enc?Promise.resolve(enc):fetch('app.enc.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('load');return r.json()}).then(function(j){enc=j;return j})}
  function decrypt(pin){
    return load().then(function(E){
      return crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']).then(function(k){
        return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.s),iterations:E.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])
      }).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.i)},key,b64(E.c))})
    }).then(function(buf){return new TextDecoder().decode(buf)});
  }
  function open(html){document.open();document.write(html);document.close()}
  function enter(pin,remember,silent){
    if(!(window.crypto&&crypto.subtle)){errEl.textContent='Браузер не поддерживает расшифровку. Откройте страницу в Chrome или Safari.';return}
    errEl.textContent=silent?'':'Проверяю…';
    decrypt(pin).then(function(html){
      try{if(remember)localStorage.setItem(KEY,pin);else localStorage.removeItem(KEY)}catch(e){}
      try{localStorage.setItem('zp_code',JSON.stringify(pin))}catch(e){} /* тот же пароль служит кодом доступа к таблице */
      open(html);
    },function(e){
      if(silent){try{localStorage.removeItem(KEY)}catch(x){}errEl.textContent='';return}
      errEl.textContent=(e&&e.message==='load')?'Не удалось загрузить страницу. Проверьте интернет.':'Неверный пароль';
    });
  }
  document.getElementById('f').onsubmit=function(ev){ev.preventDefault();enter(document.getElementById('pin').value.trim(),document.getElementById('rem').checked,false)};
  var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved)enter(saved,true,true);
})();
</script>
</body>
